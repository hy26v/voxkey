# ABOUTME: Pytest defaults for the integration suite: live per-test progress
# ABOUTME: lines with timestamps and a slowest-tests summary after each run.

[pytest]
addopts = -v -ra --durations=10
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
